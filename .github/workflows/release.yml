name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Read version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build binary
        run: bun run build

      - name: Build cross-platform binaries
        run: |
          bun build --compile --target=bun-linux-x64 src/index.ts --outfile weather-cli-linux-x64
          bun build --compile --target=bun-windows-x64 src/index.ts --outfile weather-cli-windows-x64.exe
          bun build --compile --target=bun-darwin-arm64 src/index.ts --outfile weather-cli-darwin-arm64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            weather-cli-linux-x64
            weather-cli-windows-x64.exe
            weather-cli-darwin-arm64
